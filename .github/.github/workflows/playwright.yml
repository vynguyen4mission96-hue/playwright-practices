# Tên workflow hiển thị trong tab Actions trên GitHub
name: Playwright Tests

# Quy định sự kiện nào sẽ kích hoạt workflow
on:
  # Kích hoạt khi có sự kiện push lên nhánh main
  push:
    branches: [ main ]

  # Kích hoạt khi có sự kiện Pull Request nhắm đến nhánh main
  pull_request:
    branches: [ main ]

# Khai báo các job cần thực hiện
jobs:
  # Tên job là test
  test:
    timeout-minutes: 60  # Giới hạn thời gian chạy job là 60 phút
    runs-on: ubuntu-latest  # Chạy job trên máy ảo Ubuntu do GitHub cung cấp

    # Các bước thực hiện theo thứ tự từ trên xuống dưới
    steps:
      # Bước 1: Lấy source code của repository về máy ảo
      - uses: actions/checkout@v6

      # Bước 2: Thiết lập Node.js
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*  # Sử dụng phiên bản Node.js thuộc dòng LTS

      # Bước 3: Cài dependencies theo package-lock.json
      - name: Install dependencies
        run: npm ci

      # Bước 4: Cài browser Playwright và các thư viện hệ thống cần thiết
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Bước 5: Chạy các test được Playwright phát hiện theo cấu hình hiện tại
      - name: Run Playwright tests
        run: npx playwright test

      # Bước 6: Upload report thành artifact nếu workflow chưa bị hủy
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}  # Không chạy bước này nếu workflow đã bị hủy
        with:
          name: playwright-report  # Tên artifact hiển thị trên GitHub
          path: playwright-report/  # Đường dẫn thư mục report cần upload
          retention-days: 30  # Lưu artifact trong 30 ngày