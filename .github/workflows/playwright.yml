# Tên workflow hiển thị trong tab Actions trên GitHub
name: Playwright Tests

# Quy định những sự kiện nào sẽ kích hoạt workflow
on:
  # Kích hoạt khi có sự kiện push lên nhánh được chỉ định
  push:
    branches: [ main, master ]  # Chỉ chạy khi push lên main hoặc master

  # Kích hoạt khi có sự kiện Pull Request nhắm đến nhánh được chỉ định
  pull_request:
    branches: [ main, master ]  # Nhánh đích của PR phải là main hoặc master

# Khai báo các job cần thực hiện trong workflow
jobs:
  # Tên job là test
  test:
    timeout-minutes: 60  # Job có giới hạn thời gian chạy 60 phút
    runs-on: ubuntu-latest  # Chạy job trên máy ảo Ubuntu do GitHub cung cấp

    # Các bước được thực hiện theo thứ tự từ trên xuống dưới
    steps:
      # Bước 1: Lấy source code của repository về máy ảo
      - uses: actions/checkout@v4

      # Bước 2: Cài đặt và thiết lập Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*  # Sử dụng phiên bản Node.js LTS phù hợp được phân giải khi chạy

      # Bước 3: Cài các package theo package-lock.json
      - name: Install dependencies
        run: npm ci

      # Bước 4: Cài các browser Playwright cần dùng và thư viện hệ thống trên Ubuntu
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Bước 5: Chạy các test được Playwright phát hiện
      - name: Run Playwright tests
        run: npx playwright test

      # Bước 6: Upload report thành artifact nếu workflow chưa bị hủy
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # Bỏ qua bước này nếu workflow đã bị hủy
        with:
          name: playwright-report  # Tên artifact hiển thị trên GitHub
          path: playwright-report/  # Thư mục chứa report cần upload
          retention-days: 30  # Số ngày lưu artifact